
services:
  api:
    build: .
    container_name: automl-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build: .
    container_name: automl-dashboard
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
      PROMETHEUS_URL: http://prometheus:9090
      DATASET_PATH: /app/data/raw/Telco-Customer-Churn.csv
      MLFLOW_DB_PATH: /app/mlflow.db
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./mlflow.db:/app/mlflow.db:ro
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: automl-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: automl-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
